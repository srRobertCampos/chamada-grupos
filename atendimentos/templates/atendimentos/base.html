<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chamada de grupos</title><style>
body{font:16px system-ui,sans-serif;margin:0;background:#f4f7f8;color:#173042}header{background:#174a65;color:white;padding:1rem 2rem;display:flex;gap:2rem;align-items:center;flex-wrap:wrap}header a{color:white}main{max-width:1100px;margin:2rem auto;padding:0 1rem}a{color:#145c81}button,.botao{background:#176384;color:white;border:0;border-radius:6px;padding:.6rem 1rem;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.botao:hover{background:#104b65}.card{background:white;padding:1.2rem;margin:1rem 0;border-radius:10px;box-shadow:0 2px 12px #0001}label{display:block;margin:.6rem 0}select,input{padding:.5rem;border:1px solid #adc0c9;border-radius:5px}table{border-collapse:collapse;background:white}th,td{border:1px solid #d1dce2;padding:.45rem;white-space:nowrap}th{background:#e4eff4}.scroll{overflow:auto}.msg{padding:.8rem;background:#d9f2e6;border-radius:5px}small{color:#536b77}.muted{color:#647985}
</style></head><body><header><strong>Chamada de grupos</strong>{% if user.is_authenticated %}<a href="{% url 'hoje' %}">Hoje</a><a href="{% url 'folha' %}">Folha mensal</a><a href="{% url 'extra' %}">Atendimento extra/familiar</a><a href="/admin/">Configurações</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sair</button></form>{% endif %}</header><main>{% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
