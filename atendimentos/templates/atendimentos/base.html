<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chamada de grupos</title><style>
:root{color-scheme:light;--ink:#203431;--muted:#516762;--accent:#176555;--line:#cbd8d2;--surface:#edf3ef}
*{box-sizing:border-box}
body{margin:0;background:#dbe6df;color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{background:#203b36;color:#f0f6f2;padding:1rem max(1rem,calc((100% - 1100px)/2));display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;border-bottom:4px solid #65a691}
header strong{margin-right:1rem;white-space:nowrap}
header a{color:inherit;text-decoration:none;padding:.5rem .7rem;border-radius:8px}
header a:hover,header a[aria-current=page]{background:#36564f}
header form{margin-left:auto}
header button{background:#36564f}
main{max-width:1100px;margin:2rem auto;padding:0 1rem}
h1{font-size:clamp(1.65rem,4vw,2.3rem);line-height:1.15;letter-spacing:-.03em}
h2{margin-top:0;font-size:1.25rem}
a{color:#11594b}
button,.botao{display:inline-block;padding:.65rem 1rem;border:0;border-radius:8px;background:var(--accent);color:white;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
button:hover,.botao:hover{background:#104e43}
:focus-visible{outline:3px solid #a46017;outline-offset:3px}
.card{background:var(--surface);padding:clamp(1rem,3vw,1.5rem);margin:1rem 0;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 10px #20343112}
.card>form>p:last-child{margin-bottom:0}
label{display:block;margin:.6rem 0;font-weight:600}
select,input{max-width:100%;padding:.55rem .65rem;border:1px solid #9cb3a9;border-radius:7px;background:#f4f7f4;color:var(--ink);font:inherit}
table{width:100%;border-collapse:collapse;background:#f2f6f3}
th,td{padding:.65rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{background:#d9e8df;font-weight:700}
tr:nth-child(even) td{background:#e8f0ea}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:9px}
.msg{padding:.8rem;background:#cce7d8;border-radius:8px}
small,.muted{color:var(--muted)}
@media(max-width:600px){header{gap:.25rem}header strong{flex-basis:100%}header a{font-size:.875rem}header form{margin-left:0}main{margin:1.25rem auto}}

</style></head><body><header><strong>Chamada de grupos</strong>{% if user.is_authenticated %}<a href="{% url 'hoje' %}">Hoje</a><a href="{% url 'folha' %}">Folha mensal</a><a href="{% url 'extra' %}">Atendimento extra/familiar</a><a href="/admin/">Configurações</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sair</button></form>{% endif %}</header><main>{% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
