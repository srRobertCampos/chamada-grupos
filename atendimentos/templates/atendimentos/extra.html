{% extends 'atendimentos/base.html' %}{% block content %}<h1>Atendimento extra ou familiar</h1><div class="card"><p>Este registro entra automaticamente na folha do mês. Se já existir uma chamada do mesmo usuário, grupo e data, ela será substituída.</p><form method="post">{% csrf_token %}<label>Data <input type="date" name="data" value="{{ data|date:'Y-m-d' }}" required></label><label>Usuário <select name="usuario" required>{% for u in usuarios %}<option value="{{ u.id }}">{{ u }}</option>{% endfor %}</select></label><label>Grupo <select name="grupo" required>{% for g in grupos %}<option value="{{ g.id }}">{{ g }}</option>{% endfor %}</select></label><label>Tipo <select name="tipo"><option value="AF">Atendimento Familiar</option><option value="AE">Atendimento Extra</option></select></label><label>Observação <input name="observacao" maxlength="250"></label><button type="submit">Registrar</button></form></div>{% endblock %}
